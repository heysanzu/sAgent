<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/heysanzu/sanzu/main/sanzu.png" />
  <link rel="stylesheet" href="agent/agent.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="app">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="https://raw.githubusercontent.com/heysanzu/sanzu/main/sanzu.png" alt="Agent" class="brand-logo" />
          <span>Agent</span>
        </div>
        <button class="icon-btn close-sidebar" id="closeSidebar" aria-label="Close menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New conversation
        </button>
      </div>

      <nav class="quick-actions">
        <p class="nav-label">Quick Actions</p>
        <button class="quick-btn" data-prompt="I'd like to check my order status. My order ID is ORD-1001">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Check Order Status
        </button>
        <button class="quick-btn" data-prompt="I need to update my shipping address for order ORD-1002">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          Update Shipping
        </button>
        <button class="quick-btn" data-prompt="I want to request a refund for order ORD-1003">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
          Request Refund
        </button>
        <button class="quick-btn" data-prompt="What is your return policy?">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>
          </svg>
          Return Policy
        </button>
        <button class="quick-btn" data-prompt="What payment methods do you accept?">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          Payment Methods
        </button>
        <button class="quick-btn" data-prompt="How long does shipping usually take?">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><rect width="13" height="8" x="9" y="11" rx="2"/><circle cx="11" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
          </svg>
          Shipping Times
        </button>
      </nav>

      <div class="sidebar-section history-section">
        <p class="nav-label">Recent</p>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <a href="https://github.com/heysanzu" target="_blank" rel="noopener noreferrer" class="github-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          @heysanzu
        </a>
      </div>
    </aside>

    <main class="chat-area">

      <header class="chat-header">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>
          </svg>
        </button>

        <div class="agent-identity">
          <div class="agent-avatar-sm">
            <img src="https://raw.githubusercontent.com/heysanzu/sanzu/main/sanzu.png" alt="Agent" class="avatar-logo" />
          </div>
          <div class="agent-meta">
            <span class="agent-name">Agent</span>
            <span class="agent-sub">Customer Support</span>
          </div>
        </div>

        <button class="icon-btn" id="clearChat" aria-label="Clear conversation" title="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </header>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Ask about your order, shipping, refunds…"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">
          Try: "Check ORD-1001" · "Refund ORD-1003" · "What's your return policy?"
        </p>
      </div>

    </main>
  </div>

  <script src="agent/agent.js"></script>
</body>
</html>
